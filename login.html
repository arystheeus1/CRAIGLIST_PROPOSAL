<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG IN</title>
    <link rel="stylesheet" href="../style/login.css">
    <!--fonts-->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body id="container">
    <div>
        <!--header-->
        <header class="top-bar">
            <a href="HomePage.html"><img src="../images/icon.png" alt="Craigslist"></a>
            <h2 id="company-name">craigslist</h2>
            <div class="nav-links">
                <a href="login.html" id="login">LOG IN</a>
                <a href="signUp.html" id="signup">SIGN UP</a>
            </div>
            
        </header>

        <!--welcome-->
        <div class="welcome-tag">
            <h1>Welcome Back!</h1>
            <p>Let's get you signed in</p>
        </div>

        <!--background of login form-->
        <div class="background-design"></div>

        <!--login container-->
        <main class="login-container">
            <div class="login-card">
                <form action="#" method="POST">
                    <h1>LOG-IN</h1>

                    <div class="credentials">
                        <p>Email</p>
                        <input type="email" placeholder="name@example.com" id="email" required>
                    
                        <p>Password</p>
                        <input type="password" id="password" required>
                    </div>

                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <a href="LogInHomePage.html">
                        <button type="button" class="login-btn">Login</button>
                    </a>
                    <p class="continue-p">or continue with</p>

                    <div class="socmed">
                        <a href="#">
                            <img src="../images/googlelogo.png" alt="Google Logo" id="google">
                            <img src="../images/fblogo.png" alt="Facebook Logo" id="fb">
                        </a>
                    </div>

                    <p class="create-account">Don't have an account?
                        <a href="signUp.html">Sign Up</a>
                    </p>
                </form>
            </div>
        </main>

        <footer class="login-footer">
            <div class="footer-links">
                <div class="cta-links">
                    <a href="#">PRIVACY</a>
                    <a href="#">TERMS AND CONDITION</a>
                    <a href="#">FAQ</a>
                </div>
                <p>&copy; 2026 craigslist</p>
            </div>
        </footer>
    </div>
</body>
</html>
