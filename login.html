<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG IN</title>
    <link rel="stylesheet" href="../style/login.css">
    <!--fonts-->
    <link href="https://googleapis.com" rel="stylesheet">
    <!--icon for email and password-->
   <link rel="stylesheet" href="https://cloudflare.com">
</head>

<body id="container">
    <div>
        <!--header-->
        <header class="top-bar">
            <img src="../images/icon.png" alt="Craigslist">
            <h2 id="company-name">craigslist</h2>
            <div class="nav-links">
                <a href="#" id="login">LOG IN</a>
                <a href="#" id="signup">SIGN UP</a>
            </div>
            
        </header>

        <!--welcome-->
        <div class="welcome-tag">
            <h1>Welcome Back!</h1>
            <p>Let's get you signed in</p>
        </div>

        <!--background of login form-->
        <div class="background-design"></div>

        <!--login container-->
        <main class="login-container">
            <div class="login-card">
                <form action="#" method="POST">
                    <h1>LOG-IN</h1>

                    <div class="credentials">
                        <p>Email</p>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user" ></i>
                            <input type="email" placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="credentials">
                        <p>Password</p>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock" ></i>
                            <input type="text">
                        </div>
                    </div>

                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <button type="submit" class="login-btn">Login</button>
                    <p class="continue-p">or continue with</p>

                    <div class="socmed">
                        <a href="#">
                            <img src="../images/googlelogo.png" alt="Google Logo" id="google">
                            <img src="../images/fblogo.png" alt="Facebook Logo" id="fb">
                        </a>
                    </div>

                    <p class="create-account">Don't have an account?
                        <a href="#">Sign Up</a>
                    </p>
                </form>
            </div>
        </main>

        <footer class="login-footer">
            <div class="footer-links">
                <div class="cta-links">
                    <a href="#">PRIVACY</a>
                    <a href="#">TERMS AND CONDITION</a>
                    <a href="#">FAQ</a>
                </div>
                <p>&copy; 2026 craigslist</p>
            </div>
        </footer>
    </div>
</body>
</html>
