<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>craigslist - Feedback</title>
    <link rel="stylesheet" href="feedbackstyles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <a href="index.html" class="logo-icon"><i class="fa-solid fa-peace"></i></a>
            <a href="index.html" class="brand-title">craigslist</a>
        </div>
        <div class="header-sub">
            <nav class="left-nav">
                <a href="#">Philanthropies</a>
                <a href="#">Charitable Funds</a>
                <a href="#">Craigslist Hiring</a>
            </nav>
            <nav class="right-nav">
                <a href="#">SIGN UP</a>
                <a href="#">LOG IN</a>
            </nav>
        </div>
    </header>

    <section class="banner-strip">
        <h1>Send Us Your Feedback</h1>
        <p>Help us improve your experience on craigslist</p>
    </section>

    <main class="feedback-container">
        <form class="feedback-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label for="category">Topic / Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a topic
