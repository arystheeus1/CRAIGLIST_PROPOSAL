<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>craigslist - Feedback</title>
    <link rel="stylesheet" href="feedbackstyles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <a href="index.html" class="logo-icon"><i class="fa-solid fa-peace"></i></a>
            <a href="index.html" class="brand-title">craigslist</a>
        </div>
        <div class="header-sub">
            <nav class="left-nav">
                <a href="#">Philanthropies</a>
                <a href="#">Charitable Funds</a>
                <a href="#">Craigslist Hiring</a>
            </nav>
            <nav class="right-nav">
                <a href="feedback.html">FEEDBACK</a>
                <a href="signUp.html">SIGN UP</a>
                <a href="logIn.html">LOG IN</a>
            </nav>
        </div>
    </header>

    <section class="banner-strip">
        <h1>Send Us Your Feedback</h1>
        <p>Help us improve your experience on craigslist</p>
    </section>

    <main class="feedback-container">
        <form class="feedback-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label for="category">Topic / Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a topic</option>
                    <option value="general">General Suggestion</option>
                    <option value="bug">Report a Bug / Issue</option>
                    <option value="account">Account & Log In</option>
                    <option value="safety">Safety & Fraud</option>
                    <option value="Other Concerns">Other Concerns</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" placeholder="Type your feedback here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </main>

    <footer class="main-footer">
        <div class="footer-links">
            <a href="#">PRIVACY</a>
            <a href="#">TERMS AND CONDITIONS</a>
            <a href="#">FAQ</a>
        </div>
        <div class="copyright">&copy; 2026 craigslist</div>
    </footer>
</body>
</html>
